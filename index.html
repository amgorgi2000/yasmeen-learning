<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yasmeen-learning.com</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f1f5f9;
            color: #1e293b;
            overflow: hidden;
        }

        header {
            background-color: #0f172a;
            color: #ffffff;
            padding: 10px 20px;
            font-size: 1rem;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1e293b;
            z-index: 10;
            height: 50px;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .contents-toggle-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #38bdf8;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .contents-toggle-btn:hover {
            background: #38bdf8;
            color: #0f172a;
        }

        .brand-link {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: inherit;
        }

        .brand-logo {
            width: 22px;
            height: 22px;
            fill: #38bdf8;
        }

        .brand-title {
            font-size: 1rem;
            color: #f8fafc;
        }

        .main-container {
            display: flex;
            flex: 1;
            position: relative;
            overflow: hidden;
            height: calc(100vh - 50px);
        }

        /* Split Workspace: 30% Board (Left) | 70% Content (Right) */
        .workspace-split {
            display: flex;
            width: 100%;
            height: 100%;
            gap: 8px;
            padding: 8px;
            background-color: #f1f5f9; /* Uniform light gray */
        }

        /* Classic Lighter Green Chalkboard Panel (24% - LEFT) */
        .board-panel {
            flex: 0 0 calc(24% - 4px);
            height: 100%;
            background-color: #255f41; /* Lighter green degree */
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 0);
            background-size: 16px 16px;
            border: 5px solid #2d1810;
            border-radius: 8px;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.3), 0 2px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            padding: 16px;
            color: #ffffff;
            position: relative;
            overflow-y: auto;
        }

        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        /* Site font & pure white for Board Title */
        .board-title-text {
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.3px;
            line-height: 1.2;
        }

        .board-pin {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .board-content {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #ffffff;
            flex: 1;
        }

        /* Content Panel (74% - RIGHT) */
        .content-panel {
            flex: 0 0 calc(74% - 4px);
            height: 100%;
            background-color: #f1f5f9; /* Same light gray background */
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px; /* Minimal padding around iframe */
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 6px;
            background-color: #ffffff;
        }

        /* Floating Sidebar Drawer (Covers Board on Left) */
        aside {
            position: absolute;
            top: 0;
            left: -340px;
            width: 320px;
            height: 100%;
            background-color: #1b2430;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #0f172a;
            overflow-y: auto;
            z-index: 100;
            transition: left 0.3s ease;
            box-shadow: 5px 0 25px rgba(0, 0, 0, 0.5);
        }

        aside.open {
            left: 0;
        }

        .sidebar-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(2px);
            z-index: 90;
            display: none;
        }

        .sidebar-overlay.open {
            display: block;
        }

        .sidebar-top {
            padding: 12px 16px;
            background-color: #111827;
            border-bottom: 1px solid #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dashboard-nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #38bdf8;
            font-weight: 600;
            font-size: 0.85rem;
            text-decoration: none;
            padding: 8px 12px;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            flex: 1;
        }

        .unit-list { list-style: none; }

        .unit-header {
            padding: 14px 18px;
            font-size: 0.88rem;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #111827;
            border-bottom: 1px solid #1f2937;
            cursor: pointer;
            user-select: none;
        }

        .unit-tree { list-style: none; display: none; }
        .unit-group.open .unit-tree { display: block; }

        .lesson-header {
            padding: 10px 18px 10px 24px;
            background-color: #1b2430;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.80rem;
            color: #e2e8f0;
            border-bottom: 1px solid #283545;
        }

        .sub-tree { list-style: none; display: none; background-color: #151c24; }
        .lesson-group.open .sub-tree { display: block; }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 8px 18px 8px 36px;
            color: #cbd5e1;
            text-decoration: none;
            font-size: 0.80rem;
            border-bottom: 1px solid #1e293b;
            gap: 10px;
        }

        .nav-item.active { background-color: #000000; color: #ffffff; }

        .status-icon { width: 16px; text-align: center; }
        .status-icon.active-dot { color: #38bdf8; }
        .status-icon.completed { color: #2ecc71; }
        .status-icon.upcoming { color: #64748b; }

        /* Mandatory Fullscreen Overlay */
        .fullscreen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.96);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            backdrop-filter: blur(6px);
        }

        .fullscreen-overlay.hidden {
            display: none !important;
        }

        .overlay-card {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 30px;
            max-width: 600px;
        }

        .overlay-welcome-msg {
            color: #f8fafc;
            font-size: 1.4rem;
            font-weight: 600;
            line-height: 1.5;
        }

        .overlay-sub-msg {
            color: #94a3b8;
            font-size: 1rem;
        }

        .start-btn {
            background-color: #2ecc71;
            color: #ffffff;
            font-size: 1.4rem;
            font-weight: 700;
            padding: 14px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(46, 204, 113, 0.4);
            transition: transform 0.2s ease, background-color 0.2s ease;
            letter-spacing: 1px;
        }

        .start-btn:hover {
            background-color: #27ae60;
            transform: scale(1.05);
        }

        /* Mandatory Landscape Mode Notice for Mobile Devices */
        .rotate-notice {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #0f172a;
            color: #f8fafc;
            z-index: 99999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .rotate-icon {
            font-size: 3rem;
            margin-bottom: 16px;
            animation: spinRotate 2s infinite ease-in-out;
        }

        @keyframes spinRotate {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }

        @media screen and (max-width: 768px) and (orientation: portrait) {
            .rotate-notice {
                display: flex;
            }
        }
    </style>
</head>
<body>

<!-- Forced Rotate Notice on Portrait Mobile -->
<div class="rotate-notice">
    <div class="rotate-icon">🔄</div>
    <h2>Please rotate your device</h2>
    <p style="margin-top: 8px; color: #94a3b8;">For the best learning experience, Yasmeen-learning requires Landscape Mode.</p>
</div>

<header>
    <div class="brand-container">
        <button class="contents-toggle-btn" onclick="toggleSidebar()">
            <span>☰</span>
            <span></span>
        </button>
        <a href="#" onclick="resetToHome(); return false;" class="brand-link">
            <svg class="brand-logo" viewBox="0 0 24 24">
                <path d="M12 2C11.5 5 9 7.5 6 8c3 0.5 5.5 3 6 6 0.5-3 3-5.5 6-6-3-0.5-5.5-3-6-6z" />
                <path d="M12 14c-0.3 2-1.8 3.7-3.8 4 2 0.3 3.5 1.8 3.8 3.8 0.3-2 1.8-3.5 3.8-3.8-2-0.3-3.5-1.8-3.8-4z" opacity="0.7"/>
            </svg>
            <span class="brand-title">yasmeen-learning.com</span>
        </a>
    </div>
</header>

<div class="main-container">
    <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <aside id="sidebar-drawer">
        <div class="sidebar-top">
            <a href="#" class="dashboard-nav-item" id="btn-progress-dashboard" onclick="loadProgressDashboard(this); toggleSidebar(); return false;">
                <span>📊</span>
                <span>Progress Dashboard</span>
            </a>
        </div>
        <ul class="unit-list" id="sidebar-container"></ul>
    </aside>

    <main class="workspace-split">
        <!-- Mandatory Fullscreen Enforcement Overlay -->
        <div id="fullscreen-overlay" class="fullscreen-overlay">
            <div class="overlay-card">
                <div id="overlay-msg-main" class="overlay-welcome-msg">Welcome to yasmeen-learning.com</div>
                <div id="overlay-msg-sub" class="overlay-sub-msg">To start your course, press here</div>
                <button id="start-btn" class="start-btn" onclick="requestFullScreenAndStart()">START</button>
            </div>
        </div>

        <!-- Left Panel: Classic Chalkboard Notes (30%) -->
        <section class="board-panel">
            <div class="board-header">
                <span id="board-title" class="board-title-text">Statistics: Collecting Data</span>
                <span class="board-pin">📌</span>
            </div>
            <div id="board-content" class="board-content"></div>
        </section>

        <!-- Right Panel: Content Frame (70%) -->
        <section class="content-panel">
            <iframe 
                id="content-frame" 
                src="./landing.html" 
                allow="fullscreen *;" 
                allowfullscreen="true">
            </iframe>
        </section>
    </main>
</div>

<script>
    let isSessionStarted = false;

    const courseData = [
        {
            id: "00",
            title: "0: The Art of Statistics",
            lessons: [
                { 
                    title: "1. Collecting Data", 
                    items: [
                        { name: "Lesson", path: "./lesson_00_01/lesson/lesson.html" },
                        { name: "Explain", path: "./lesson_00_01/explain/explain.html" },
                        { name: "Quiz", path: "./lesson_00_01/quiz/quiz.html" }
                    ]
                },
                { title: "2. Organizing Data" },
                { title: "3. Presenting Data" },
                { title: "4. Analyzing Data" },
                { title: "5. Interpreting Data" },
                { title: "6. Finding Patterns" },
                { title: "7. Decision Making" }
            ]
        },
        {
            id: "01",
            title: "1-1: Correlation",
            lessons: [
                { title: "1. Introduction" }, { title: "2. Scatter diagram" }, { title: "3. Correlation" }, 
                { title: "4. Linear Correlation" }, { title: "5. Direct Correlation" }, { title: "6. Inverse Correlation" }, 
                { title: "7. Correlation Coefficient" }, { title: "8. Pearson's Method" }, { title: "9. Spearman's Method" }
            ]
        },
        {
            id: "02",
            title: "1-2: Regression",
            lessons: [
                { title: "1. Introduction" }, { title: "2. Regression" }, { title: "3. Types of Regression" }, 
                { title: "4. Method of Least Squares" }, { title: "5. Regression Line" }
            ]
        },
        { id: "03", title: "2-1: Stem-and-Leaf", lessons: [{ title: "1. Introduction" }] },
        { id: "04", title: "2-2: Quartile", lessons: [{ title: "1. Introduction" }] },
        { id: "05", title: "2-3: Semi-inter Quartile Range", lessons: [{ title: "1. Introduction" }] },
        { id: "06", title: "3-1: Probability", lessons: [{ title: "1. Introduction" }] },
        { id: "07", title: "3-2: Conditional Probability", lessons: [{ title: "1. Introduction" }] },
        { id: "08", title: "3-3: Independent Events", lessons: [{ title: "1. Introduction" }] },
        { id: "09", title: "4-1: Discrete Random Variable", lessons: [{ title: "1. Introduction" }] },
        { id: "10", title: "4-2: Expectation (mean) and Variance", lessons: [{ title: "1. Introduction" }] },
        { id: "11", title: "4-3: Geometric and Binomial Distributions", lessons: [{ title: "1. Introduction" }] },
        { id: "12", title: "4-4: Continuous Random Variable", lessons: [{ title: "1. Introduction" }] },
        { id: "13", title: "5-1: Normal Distribution", lessons: [{ title: "1. Introduction" }] },
        { id: "14", title: "5-2: Normal Distribution Applications", lessons: [{ title: "1. Introduction" }] },
        { id: "15", title: "5-3: Estimation and Confidence Intervals", lessons: [{ title: "1. Introduction" }] }
    ];

    function toggleSidebar() {
        document.getElementById('sidebar-drawer').classList.toggle('open');
        document.getElementById('sidebar-overlay').classList.toggle('open');
    }

    function isUrlVisited(url) {
        try {
            const visited = JSON.parse(localStorage.getItem('yasmeen_visited') || '[]');
            const cleanTarget = url.replace(/^(\.\/|\/)/, '').toLowerCase();
            return visited.some(vPath => vPath.replace(/^(\.\/|\/)/, '').toLowerCase().endsWith(cleanTarget));
        } catch (e) {
            return false;
        }
    }

    function renderSidebar() {
        const container = document.getElementById('sidebar-container');
        let html = '';

        courseData.forEach((unit) => {
            html += `
            <li class="unit-group">
                <div class="unit-header" onclick="toggleUnit(this)">
                    <span>${unit.title}</span>
                    <span>▼</span>
                </div>
                <ul class="unit-tree">`;

            unit.lessons.forEach((lesson) => {
                const lessonTitle = lesson.title || lesson;
                const hasItems = lesson.items && lesson.items.length > 0;

                html += `
                    <li class="lesson-group">
                        <div class="lesson-header" onclick="toggleLesson(this)">
                            <span>${lessonTitle}</span>
                            <span>▼</span>
                        </div>
                        <ul class="sub-tree">`;

                if (hasItems) {
                    lesson.items.forEach((item) => {
                        html += `<li><a href="#" class="nav-item" onclick="loadContent(this, '${item.path}'); toggleSidebar(); return false;"><span class="status-icon upcoming">○</span><span class="item-title">${item.name}</span></a></li>`;
                    });
                } else {
                    html += `<li><span class="nav-item" style="color: #64748b; font-style: italic;"><span class="status-icon">⏳</span><span>Coming soon</span></span></li>`;
                }

                html += `</ul></li>`;
            });

            html += `</ul></li>`;
        });

        container.innerHTML = html;
        restoreLastSession();
        updateSidebarStatusIcons();
    }

    function toggleUnit(headerElem) {
        const currentUnit = headerElem.closest('.unit-group');
        const isOpen = currentUnit.classList.contains('open');
        document.querySelectorAll('.unit-group').forEach(g => g.classList.remove('open'));
        if (!isOpen) currentUnit.classList.add('open');
    }

    function toggleLesson(headerElem) {
        const currentLesson = headerElem.closest('.lesson-group');
        const parentUnit = currentLesson.closest('.unit-group');
        const isOpen = currentLesson.classList.contains('open');
        parentUnit.querySelectorAll('.lesson-group').forEach(g => g.classList.remove('open'));
        if (!isOpen) currentLesson.classList.add('open');
    }

    function updateSidebarStatusIcons() {
        document.querySelectorAll('.nav-item').forEach(item => {
            const onclickStr = item.getAttribute('onclick') || '';
            const match = onclickStr.match(/loadContent\(this,\s*['"]([^'"]+)['"]\)/);
            if (!match) return;

            const url = match[1];
            const icon = item.querySelector('.status-icon');
            if (!icon) return;

            const isActive = item.classList.contains('active');
            const isCompleted = isUrlVisited(url);

            if (isCompleted) {
                icon.className = 'status-icon completed';
                icon.textContent = '✓';
            } else if (isActive) {
                icon.className = 'status-icon active-dot';
                icon.textContent = '●';
            } else {
                icon.className = 'status-icon upcoming';
                icon.textContent = '○';
            }
        });
    }

    function clearActiveStates() {
        document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
        const dashBtn = document.getElementById('btn-progress-dashboard');
        if (dashBtn) dashBtn.classList.remove('active');
    }

    function updateBoardTitle(titleText) {
        const boardTitle = document.getElementById('board-title');
        if (boardTitle) {
            boardTitle.textContent = titleText || 'Statistics: Collecting Data';
        }
    }

    /* FULLSCREEN STRICT LOGIC */
    function requestFullScreenAndStart() {
        const docEl = document.documentElement;
        if (docEl.requestFullscreen) {
            docEl.requestFullscreen().catch(() => {});
        } else if (docEl.mozRequestFullScreen) {
            docEl.mozRequestFullScreen().catch(() => {});
        } else if (docEl.webkitRequestFullscreen) {
            docEl.webkitRequestFullscreen().catch(() => {});
        } else if (docEl.msRequestFullscreen) {
            docEl.msRequestFullscreen().catch(() => {});
        }

        isSessionStarted = true;
        document.getElementById('fullscreen-overlay').classList.add('hidden');

        const iframe = document.getElementById('content-frame');
        if (iframe && iframe.contentWindow) {
            iframe.contentWindow.postMessage({ type: 'START_LESSON', start_id: 1, lock_duration: 5000 }, '*');
        }
    }

    function checkFullscreenState() {
        const isFS = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
        
        if (!isFS && isSessionStarted) {
            document.getElementById('overlay-msg-main').textContent = "You exit Yasmeen-learning.com";
            document.getElementById('overlay-msg-sub').textContent = "To return to your course, press here";
            document.getElementById('fullscreen-overlay').classList.remove('hidden');
        }
    }

    document.addEventListener('fullscreenchange', checkFullscreenState);
    document.addEventListener('webkitfullscreenchange', checkFullscreenState);
    document.addEventListener('mozfullscreenchange', checkFullscreenState);
    document.addEventListener('MSFullscreenChange', checkFullscreenState);

    function loadProgressDashboard(elem) {
        updateBoardTitle("Progress Dashboard");
        document.getElementById('content-frame').src = './progress_report.html';
        localStorage.setItem('yasmeen_last_url', './progress_report.html');

        clearActiveStates();
        if (elem) elem.classList.add('active');
    }

    function loadContent(linkElem, url) {
        document.getElementById('content-frame').src = url;
        localStorage.setItem('yasmeen_last_url', url);

        clearActiveStates();
        linkElem.classList.add('active');
        updateSidebarStatusIcons();
    }

    function restoreLastSession() {
        const savedUrl = localStorage.getItem('yasmeen_last_url');
        if (!savedUrl) return;

        if (savedUrl === './progress_report.html') {
            const dashBtn = document.getElementById('btn-progress-dashboard');
            loadProgressDashboard(dashBtn);
            return;
        }

        const targetLink = Array.from(document.querySelectorAll('.nav-item')).find(a => 
            a.getAttribute('onclick') && a.getAttribute('onclick').includes(savedUrl)
        );

        if (targetLink) {
            const lessonGroup = targetLink.closest('.lesson-group');
            const unitGroup = targetLink.closest('.unit-group');

            if (unitGroup) unitGroup.classList.add('open');
            if (lessonGroup) lessonGroup.classList.add('open');

            loadContent(targetLink, savedUrl);
        }
    }

    function resetToHome() {
        updateBoardTitle("Welcome to classroom!");
        localStorage.removeItem('yasmeen_last_url');
        document.getElementById('content-frame').src = './landing.html';

        document.querySelectorAll('.unit-group').forEach(g => g.classList.remove('open'));
        document.querySelectorAll('.lesson-group').forEach(g => g.classList.remove('open'));

        clearActiveStates();
        updateSidebarStatusIcons();
    }

    window.addEventListener('message', (e) => {
        if (e.data === 'MODULE_COMPLETED') updateSidebarStatusIcons();
        if (e.data && e.data.type === 'SET_TITLE') {
            updateBoardTitle(e.data.title);
        }
        if (e.data && e.data.type === 'UPDATE_BOARD') {
            const board = document.getElementById('board-content');
            if (board && e.data.htmlContent) {
                board.innerHTML = e.data.htmlContent;
            }
        }
    });

    setInterval(updateSidebarStatusIcons, 1000);
    renderSidebar();
</script>
</body>
</html>
