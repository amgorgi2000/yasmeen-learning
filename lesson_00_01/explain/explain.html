<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistics: Collecting Data - Explained (AI Generated)</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .lesson-container {
            background-color: #ffffff;
            padding: 25px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 900px;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Header Layout */
        #lesson-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
            gap: 15px;
        }

        h1 {
            color: #333;
            margin: 0;
            font-size: 1.4rem;
            text-align: left;
        }

        .btn-fullscreen {
            background-color: #2c3e50;
            color: white;
            font-size: 0.85rem;
            padding: 8px 14px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
        }
        
        /* Slideshow Styling */
        #slideshow-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .slide-image {
            width: 100%;
            max-height: 65vh;
            height: auto;
            object-fit: contain;
            background-color: #000;
            border-radius: 8px;
            display: block;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }

        button {
            padding: 10px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        button:hover:not(:disabled) {
            opacity: 0.9;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed !important;
        }
        .btn-prev {
            background-color: #7f8c8d;
            color: white;
        }
        .btn-next {
            background-color: #3498db;
            color: white;
        }

        /* Fullscreen Layout Fix - No Scrollbars */
        .lesson-container:fullscreen,
        .lesson-container:-webkit-full-screen {
            max-width: 100vw;
            width: 100vw;
            height: 100vh;
            border-radius: 0;
            padding: 20px 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        .lesson-container:fullscreen .slide-image,
        .lesson-container:-webkit-full-screen .slide-image {
            max-height: calc(100vh - 130px);
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

<div class="lesson-container" id="lesson-container">
    <div id="lesson-header">
        <h1 id="main-title">Statistics: Collecting Data - Explained (AI Generated)</h1>
        <button class="btn-fullscreen" onclick="toggleFullscreen()">Fullscreen</button>
    </div>

    <!-- Slideshow View -->
    <div id="slideshow-wrapper">
        <img id="slide-img" class="slide-image" src="" alt="Slide Image">
        <div class="nav-buttons">
            <button class="btn-prev" id="slide-prev-btn" onclick="navigateSlide(-1)">Previous</button>
            <button class="btn-next" id="slide-next-btn" onclick="navigateSlide(1)">Next</button>
        </div>
    </div>
</div>

<script>
    const SLIDE_DELAY_MS = 5000; // Adjusted delay

    const slideImages = [
        "./image/image01.png",
        "./image/image02.png",
        "./image/image03.png",
        "./image/image04.png",
        "./image/image05.png",
        "./image/image06.png",
        "./image/image07.png",
        "./image/image08.png",
        "./image/image09.png",
        "./image/image10.png",
        "./image/image11.png",
        "./image/image12.png"
    ];

    let currentSlideIndex = 0;
    let slideTimer = null;

    // Track unlock status for each slide (0 = locked, 1 = unlocked)
    let slideUnlocked = new Array(slideImages.length).fill(false);

    function updateSlide() {
        const imgElement = document.getElementById('slide-img');
        const prevBtn = document.getElementById('slide-prev-btn');

        imgElement.src = slideImages[currentSlideIndex];

        // Disable Previous on first slide
        prevBtn.disabled = currentSlideIndex === 0;

        if (slideTimer) clearTimeout(slideTimer);

        const isLastSlide = currentSlideIndex === slideImages.length - 1;

        if (isLastSlide) {
            slideUnlocked[currentSlideIndex] = true;
            recordLessonCompletion();
            updateNextButtonState();
        } else if (slideUnlocked[currentSlideIndex]) {
            // Already viewed this slide before — unlock immediately
            updateNextButtonState();
        } else {
            // Unvisited slide — lock and set timeout
            updateNextButtonState();

            slideTimer = setTimeout(() => {
                slideUnlocked[currentSlideIndex] = true;
                updateNextButtonState();
            }, SLIDE_DELAY_MS);
        }
    }

    function navigateSlide(direction) {
        // Block forward navigation if current slide is still locked
        if (direction === 1 && !slideUnlocked[currentSlideIndex]) return;

        const isLastSlide = currentSlideIndex === slideImages.length - 1;

        if (isLastSlide && direction === 1) {
            if (document.fullscreenElement) {
                exitFullscreenHandler();
            }
            return;
        }

        currentSlideIndex += direction;
        if (currentSlideIndex < 0) currentSlideIndex = 0;
        if (currentSlideIndex >= slideImages.length) currentSlideIndex = slideImages.length - 1;

        updateSlide();
    }

    function updateNextButtonState() {
        const nextBtn = document.getElementById('slide-next-btn');
        if (!nextBtn) return;

        const isLastSlide = currentSlideIndex === slideImages.length - 1;

        if (isLastSlide) {
            if (document.fullscreenElement) {
                nextBtn.disabled = false;
                nextBtn.innerText = 'Exit Fullscreen';
            } else {
                nextBtn.disabled = true;
                nextBtn.innerText = 'Next';
            }
        } else {
            nextBtn.innerText = 'Next';
            nextBtn.disabled = !slideUnlocked[currentSlideIndex];
        }
    }

    function recordLessonCompletion() {
        try {
            const fullPath = window.location.pathname;
            const match = fullPath.match(/\/(Lesson_[^\/]+\/index\.html)/);
            const relativeUrl = match ? `./${match[1]}` : fullPath;

            let visited = JSON.parse(localStorage.getItem('yasmeen_visited') || '[]');
            if (!visited.includes(relativeUrl)) {
                visited.push(relativeUrl);
                localStorage.setItem('yasmeen_visited', JSON.stringify(visited));
            }
        } catch (e) {
            console.error("Failed to record lesson completion to localStorage:", e);
        }
    }

    function exitFullscreenHandler() {
        if (document.exitFullscreen) {
            document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
        } else if (document.msExitFullscreen) {
            document.msExitFullscreen();
        }
    }

    document.addEventListener('fullscreenchange', updateNextButtonState);
    document.addEventListener('webkitfullscreenchange', updateNextButtonState);
    document.addEventListener('msfullscreenchange', updateNextButtonState);

    function toggleFullscreen() {
        const container = document.getElementById('lesson-container');
        if (!document.fullscreenElement) {
            if (container.requestFullscreen) {
                container.requestFullscreen();
            } else if (container.webkitRequestFullscreen) {
                container.webkitRequestFullscreen();
            } else if (container.msRequestFullscreen) {
                container.msRequestFullscreen();
            }
        } else {
            exitFullscreenHandler();
        }
    }

    document.addEventListener('keydown', function(event) {
        if (event.key === 'ArrowRight' || event.key === ' ') {
            event.preventDefault();
            if (slideUnlocked[currentSlideIndex]) navigateSlide(1);
        } else if (event.key === 'ArrowLeft') {
            event.preventDefault();
            navigateSlide(-1);
        }
    });

    window.onload = updateSlide;
</script>

</body>
</html>
