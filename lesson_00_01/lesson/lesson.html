<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistics: Collecting Data</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #f8fafc;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lesson-container {
            background-color: #ffffff;
            padding: 12px 16px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Slideshow Styling - Flex 1 fills available height */
        #slideshow-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            flex: 1;
            min-height: 0; /* Prevents overflow in flexbox */
        }

        .slide-image {
            width: 100%;
            flex: 1;
            min-height: 0;
            object-fit: contain;
            background-color: #000000;
            border-radius: 6px;
            display: block;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }

        button {
            padding: 8px 18px;
            font-size: 0.95rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        button:hover:not(:disabled) {
            opacity: 0.9;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed !important;
        }
        .btn-prev {
            background-color: #7f8c8d;
            color: white;
        }
        .btn-next {
            background-color: #3498db;
            color: white;
        }
        .btn-finish {
            background-color: #2ecc71;
            color: white;
        }
    </style>
</head>
<body>

<div class="lesson-container" id="lesson-container">
    <!-- Slideshow View -->
    <div id="slideshow-wrapper">
        <img id="slide-img" class="slide-image" src="" alt="Slide Image">
        <div class="nav-buttons">
            <button class="btn-prev" id="slide-prev-btn" onclick="navigateSlide(-1)">Previous</button>
            <button class="btn-next" id="slide-next-btn" onclick="navigateSlide(1)">Next</button>
        </div>
    </div>
</div>

<script>
    const SLIDE_DELAY_MS = 5000;

    const slideImages = [
        "./image/image01.png",
        "./image/image02.png",
        "./image/image03.png",
        "./image/image04.png",
        "./image/image05.png",
        "./image/image06.png",
        "./image/image07.png",
        "./image/image08.png",
        "./image/image09.png",
        "./image/image10.png"
    ];

    let currentSlideIndex = 0;
    let slideTimer = null;

    let slideUnlocked = new Array(slideImages.length).fill(false);

    function updateSlide() {
        const imgElement = document.getElementById('slide-img');
        const prevBtn = document.getElementById('slide-prev-btn');

        imgElement.src = slideImages[currentSlideIndex];

        prevBtn.disabled = currentSlideIndex === 0;

        if (slideTimer) clearTimeout(slideTimer);

        const isLastSlide = currentSlideIndex === slideImages.length - 1;

        if (isLastSlide) {
            slideUnlocked[currentSlideIndex] = true;
            recordLessonCompletion();
            updateNextButtonState();
        } else if (slideUnlocked[currentSlideIndex]) {
            updateNextButtonState();
        } else {
            updateNextButtonState();

            slideTimer = setTimeout(() => {
                slideUnlocked[currentSlideIndex] = true;
                updateNextButtonState();
            }, SLIDE_DELAY_MS);
        }
    }

    function navigateSlide(direction) {
        const isLastSlide = currentSlideIndex === slideImages.length - 1;

        if (direction === 1) {
            if (!slideUnlocked[currentSlideIndex]) return;

            if (isLastSlide) {
                finishLesson();
                return;
            }
        }

        currentSlideIndex += direction;
        if (currentSlideIndex < 0) currentSlideIndex = 0;
        if (currentSlideIndex >= slideImages.length) currentSlideIndex = slideImages.length - 1;

        updateSlide();
    }

    function updateNextButtonState() {
        const nextBtn = document.getElementById('slide-next-btn');
        if (!nextBtn) return;

        const isLastSlide = currentSlideIndex === slideImages.length - 1;

        if (isLastSlide) {
            nextBtn.innerText = 'Finish';
            nextBtn.className = 'btn-finish';
            nextBtn.disabled = false;
        } else {
            nextBtn.innerText = 'Next';
            nextBtn.className = 'btn-next';
            nextBtn.disabled = !slideUnlocked[currentSlideIndex];
        }
    }

    function finishLesson() {
        window.parent.postMessage({ type: 'LESSON_FINISHED' }, '*');
    }

    function recordLessonCompletion() {
        try {
            const fullPath = window.location.pathname;
            const match = fullPath.match(/\/(Lesson_[^\/]+\/index\.html)/);
            const relativeUrl = match ? `./${match[1]}` : fullPath;

            let visited = JSON.parse(localStorage.getItem('yasmeen_visited') || '[]');
            if (!visited.includes(relativeUrl)) {
                visited.push(relativeUrl);
                localStorage.setItem('yasmeen_visited', JSON.stringify(visited));
            }
        } catch (e) {
            console.error("Failed to record lesson completion to localStorage:", e);
        }
    }

    document.addEventListener('keydown', function(event) {
        if (event.key === 'ArrowRight' || event.key === ' ') {
            event.preventDefault();
            if (slideUnlocked[currentSlideIndex]) navigateSlide(1);
        } else if (event.key === 'ArrowLeft') {
            event.preventDefault();
            navigateSlide(-1);
        }
    });

    window.onload = updateSlide;

    window.addEventListener('DOMContentLoaded', () => {
        window.parent.postMessage({
            type: 'SET_TITLE',
            title: document.title
        }, '*');
    });
</script>
</body>
</html>
